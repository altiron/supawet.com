<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supawet Muennoie</title>
<link rel="icon" type="image/x-icon" href="images/supawet.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Montserrat:wght@200;300;400;500&family=Noto+Sans+Thai:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0b0e; --bubble:#17171d; --me:#3b3b46; --fg:#ececf1; --dim:#9a9aa6; --line:#26262e; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg);
         font-family:"Montserrat","Noto Sans Thai",system-ui,sans-serif; font-weight:300;
         height:100vh; display:flex; flex-direction:column; }
  body::before { content:""; position:fixed; inset:0; z-index:-2;
         background:url("images/slider.jpg") center 30%/cover no-repeat; }
  body::after { content:""; position:fixed; inset:0; z-index:-1;
         background:linear-gradient(180deg, rgba(8,8,11,.45) 0%, rgba(8,8,11,.72) 40%, rgba(8,8,11,.94) 100%); }
  header { padding:22px 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px;
         backdrop-filter:blur(10px); background:rgba(11,11,14,.35); }
  .dot { width:8px; height:8px; border-radius:50%; background:#7ee787; box-shadow:0 0 10px #7ee78766; }
  header img.logo { height:20px; filter:invert(1); opacity:.92; }
  header span { color:var(--dim); font-family:"Cormorant Garamond",serif; font-style:italic;
         font-size:19px; font-weight:400; letter-spacing:.5px; }
  #chat { flex:1; overflow-y:auto; padding:32px 28px; max-width:680px; width:100%; margin:0 auto;
          display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:78%; padding:14px 20px; border-radius:20px; font-size:14.5px; font-weight:300;
         line-height:1.85; letter-spacing:.4px; animation:pop .3s ease; }
  .msg.bot { background:rgba(23,23,29,.82); backdrop-filter:blur(8px); border-bottom-left-radius:6px; align-self:flex-start; }
  .msg.user { background:rgba(59,59,70,.88); backdrop-filter:blur(8px); border-bottom-right-radius:6px; align-self:flex-end; }
  .msg a { color:#a5c8ff; text-decoration:none; border-bottom:1px solid #a5c8ff55; }
  .typing { color:var(--dim); font-family:"Cormorant Garamond",serif; font-style:italic;
         font-size:17px; align-self:flex-start; display:none; letter-spacing:1px; }
  @keyframes pop { from{opacity:0;transform:translateY(8px);} }
  .chips { padding:0 28px 14px; max-width:680px; width:100%; margin:0 auto; display:flex; gap:10px; flex-wrap:wrap; }
  .chip { background:rgba(11,11,14,.5); backdrop-filter:blur(8px); border:1px solid var(--line); color:var(--dim); border-radius:999px;
          padding:8px 18px; font-size:13px; font-weight:300; letter-spacing:1px; cursor:pointer;
          font-family:inherit; transition:.2s; }
  .chip:hover { color:var(--fg); border-color:var(--fg); }
  form { padding:0 28px 28px; max-width:680px; width:100%; margin:0 auto; display:flex; gap:12px; }
  input { flex:1; background:rgba(23,23,29,.85); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:999px;
          padding:14px 22px; color:var(--fg); font-size:15px; font-weight:300; letter-spacing:.5px;
          outline:none; font-family:inherit; }
  input::placeholder { color:#55555e; }
  input:focus { border-color:#55555e; }
</style>
</head>
<body>
<header><div class="dot"></div><img class="logo" src="images/supawet.svg" alt="Supawet"><span>— ask me anything</span></header>
<div id="chat">
  <div class="msg bot">สวัสดีครับ — I'm Supawet Muennoie. Well, the website version of me. Ask me anything, or pick a topic below.</div>
</div>
<div class="typing" id="typing">typing…</div>
<div class="chips" id="chips"></div>
<form id="f"><input id="in" placeholder="ask something…" autocomplete="off"></form>
<script>
const KB = [
  [/who|about|คือ|ใคร|แนะนำ/i, "I'm Supawet Muennoie — 20+ years in IT, from web development to project management. These days I'm most excited about machine learning &amp; AI."],
  [/interest|สนใจ|skill|ถนัด|passion/i, "My interests: web development, machine learning, and project management. Lately the ML/AI side is where I spend most of my curiosity."],
  [/ai|ml|machine|learning/i, "That's my current obsession — learning how machines learn. This chat-style site is kind of a tribute to that 🙂"],
  [/project|site|website|เว็บ|ทำอะไร|built/i, "Sites I run: <a href='https://altiron.com'>altiron.com</a>, <a href='https://soundclearmusic.com'>soundclearmusic.com</a>, <a href='https://deviwax.com'>deviwax.com</a> — all self-hosted on my own server."],
  [/contact|reach|email|ติดต่อ|mail|phone|เบอร์/i, "Email: <a href='mailto:supawet.mu@gmail.com'>supawet.mu@gmail.com</a><br>Phone: +66 8 1396 3651"],
  [/facebook|fb|social|linkedin/i, "Find me on <a href='https://fb.com/supawet'>Facebook</a> or <a href='https://linkedin.com/in/supawet'>LinkedIn</a>."],
  [/hi|hello|hey|สวัสดี|หวัดดี/i, "Hey! Ask me about who I am, what I'm into, or how to reach me."],
];
const chips = ["who are you?","what are you into?","your websites","how to reach you"];
const chat=document.getElementById('chat'), typing=document.getElementById('typing');
function add(t,who){const d=document.createElement('div');d.className='msg '+who;d.innerHTML=t;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function ask(q){add(q,'user');typing.style.display='block';chat.scrollTop=chat.scrollHeight;
  setTimeout(()=>{typing.style.display='none';
    const hit=KB.find(([r])=>r.test(q));
    add(hit?hit[1]:"I'm just a static page pretending to be smart — try one of the suggested questions 🙂",'bot');},800);}
document.getElementById('f').onsubmit=e=>{e.preventDefault();
  const v=document.getElementById('in');if(v.value.trim()){ask(v.value);v.value='';}};
const c=document.getElementById('chips');
for(const q of chips){const b=document.createElement('button');b.className='chip';
  b.textContent=q;b.onclick=()=>ask(q);c.appendChild(b);}
</script>
</body>
</html>
